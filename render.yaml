services:
  - type: web
    name: san-isidro-electoral-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: CORS_ALLOWED_ORIGIN
        sync: false # setear a mano: uno o varios orígenes separados por coma, p.ej.
        # https://panel-de-gestion-lla-si.netlify.app,https://<usuario>.github.io
